<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema03</title>
</head>
<body>
    
    <script>

        let anioNacimiento = Number(prompt("Ingrese su año de nacimiento: "));
        let anioActual = Number(prompt("Ingrese año actual: "))

        /*Proceso de datos*/
        let edad = anioActual - anioNacimiento

        /* SALIDA DE DATOS*/
        document.write("Resultado: " + "<br>");
        document.write("-------------------------------" + "<br>");
        document.write("Su edad aproximada es: " + edad + " años" + "<br>");
    </script>
</body>
</html>
