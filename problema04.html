<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        /*Entrada de datos*/
        let alumno =prompt("Ingrese su nombre: ");
        let curso = prompt("Ingrese el curso: ");

        let n1 = Number(prompt("Ingrese nota 1: "));
        let n2 = Number(prompt("Ingrese nota 1: "));
        let n3 = Number(prompt("Ingrese nota 1: "));
        let prom;

        /* Calculo de promedio*/
        prom =(n1 + n2 + n3)/3

        /* SALIDA DE DATOS*/
        document.write("Resultado: " + "<br>");
        document.write("-------------------------------" + "<br>");
        document.write("Estudiante: " + alumno + "<br>");
        document.write("Curso: " + curso + "<br>");
        document.write("-------------------------------" + "<br>");
        document.write("Promedio: " + prom.toFixed(2) + "<br>");
    </script>
</body>
</html>
